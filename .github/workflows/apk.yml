name: Construir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Descargar librerías (la app funciona sin internet)
        run: |
          L=app/src/main/assets/lib
          mkdir -p $L
          C=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSL -o $L/pdf.min.js        $C/pdf.js/3.11.174/pdf.min.js
          curl -fsSL -o $L/pdf.worker.min.js $C/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSL -o $L/pdf-lib.min.js    $C/pdf-lib/1.17.1/pdf-lib.min.js
          curl -fsSL -o $L/jszip.min.js      $C/jszip/3.10.1/jszip.min.js
          curl -fsSL -o $L/pptxgen.bundle.js $C/pptxgenjs/3.12.0/pptxgen.bundle.js
          ls -la $L

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FerchGamPDF-prueba-${{ github.run_number }}.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-${{ github.run_number }}
          name: FerchGam PDF – prueba ${{ github.run_number }}
          body: APK de prueba. Descárgalo en tu teléfono Android e instálalo.
          files: FerchGamPDF-prueba-${{ github.run_number }}.apk
